name: Supabase clean migration install

on:
  push:
    branches:
      - fix/supabase-migration-history-reconciliation-20261126
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean PostgreSQL install and CLI migration history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated clean-install workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/polychat-clean/supabase/migrations" "$RUNNER_TEMP/polychat-clean/supabase/tests"
          cp supabase/migrations/*.sql "$RUNNER_TEMP/polychat-clean/supabase/migrations/"
          cp supabase/tests/issue_115_private_bucket.integration.sql "$RUNNER_TEMP/polychat-clean/supabase/tests/"
          count=$(find "$RUNNER_TEMP/polychat-clean/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -eq 19
          echo "Prepared $count migration files, including the 10 MB decimal bucket correction."

      - name: Initialize isolated Supabase local project
        working-directory: ${{ runner.temp }}/polychat-clean
        run: supabase init

      - name: Start disposable local Supabase stack
        working-directory: ${{ runner.temp }}/polychat-clean
        run: supabase start

      - name: Apply all migrations to an empty local database
        working-directory: ${{ runner.temp }}/polychat-clean
        run: supabase db reset --local

      - name: Run Issue #115 private bucket integration assertion
        working-directory: ${{ runner.temp }}/polychat-clean
        shell: bash
        run: |
          set -euo pipefail
          db_container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)
          test -n "$db_container"
          docker exec "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "$(cat supabase/tests/issue_115_private_bucket.integration.sql)"

      - name: Verify CLI migration history
        working-directory: ${{ runner.temp }}/polychat-clean
        run: |
          set -euo pipefail
          supabase migration list --local
          expected=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          actual=$(supabase migration list --local | grep -oE '[0-9]{14}' | sort -u | wc -l)
          echo "Expected local migration files: $expected"
          echo "CLI migration entries: $actual"
          test "$actual" -eq "$expected"

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/polychat-clean
        run: supabase stop --no-backup
