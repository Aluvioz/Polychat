name: UX #94 browser smoke (Playwright Chromium)

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/prototipos/issue-94/**'
      - 'tests/browser/issue-94-browser.test.mjs'
      - '.github/workflows/issue-94-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-94-browser:
    name: Navegação real (mobile e TI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install pinned Playwright for browser smoke
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise HTML prototype using Chromium
        run: node --test tests/browser/issue-94-browser.test.mjs
      - name: Attach fictional screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux94-chromium-screenshots
          path: artifacts/ux94/*.png
          if-no-files-found: ignore
          retention-days: 7
