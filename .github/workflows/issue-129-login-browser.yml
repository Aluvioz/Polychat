name: UX #129 — login browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'tests/browser/issue-129-login.test.mjs'
      - '.github/workflows/issue-129-login-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save --package-lock=false playwright@1.57.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Run login browser checks
        run: |
          set -o pipefail
          mkdir -p artifacts/ux129
          npm run start > artifacts/ux129/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/login -o /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/login -o /dev/null
          node --test tests/browser/issue-129-login.test.mjs 2>&1 | tee artifacts/ux129/results.log
      - name: Upload screenshots and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux129-login-browser-evidence
          path: artifacts/ux129/
          if-no-files-found: warn
          retention-days: 14
